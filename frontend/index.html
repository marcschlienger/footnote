<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Automated research assistant that searches, crawls, and saves findings">
    <meta name="theme-color" content="#4f46e5">
    <title>Research Assistant</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Research Assistant</h1>
            <p class="subtitle">Enter a research question and we'll search, crawl references, and save everything to your notes.</p>
        </header>

        <main>
            <form id="research-form">
                <div class="form-group">
                    <label for="question">Research Question</label>
                    <textarea
                        id="question"
                        name="question"
                        rows="4"
                        placeholder="What are the latest developments in quantum computing?"
                        required
                    ></textarea>
                </div>
                <button type="submit" id="submit-btn">
                    <span class="btn-text">Start Research</span>
                    <span class="btn-loading" hidden>Submitting...</span>
                </button>
            </form>

            <div id="notification-banner" class="banner" hidden>
                <p>Enable notifications to be alerted when your research is complete.</p>
                <button id="enable-notifications">Enable Notifications</button>
            </div>

            <section id="status-section" hidden>
                <h2>Current Job</h2>
                <div class="status-card">
                    <div class="status-header">
                        <span id="status-badge" class="badge">pending</span>
                        <span id="job-id" class="job-id"></span>
                    </div>
                    <p id="status-question" class="status-question"></p>
                    <p id="status-progress" class="status-progress"></p>
                    <a id="status-result" class="status-result" href="#" target="_blank" hidden>View Results in Notion</a>
                    <p id="status-error" class="status-error" hidden></p>
                </div>
            </section>
        </main>

        <footer>
            <p>Research Assistant PWA</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
